name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Keystore
        run: |
          if [ ! -f release.jks ]; then
            keytool -genkeypair -keystore release.jks -alias key -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=The adventurer"
            git config user.name bot
            git config user.email bot@users.noreply.github.com
            git add release.jks
            git commit -m keystore
            git push
          fi
      - run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" app/build/outputs/apk/release/*.apk --title "APK build ${{ github.run_number }}" --notes "APK debug"
